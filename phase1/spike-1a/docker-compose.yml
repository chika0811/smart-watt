version: '3.8'

services:
  postgres_spike:
    image: postgres:15-alpine
    container_name: noskytech_spike_1a_db
    environment:
      POSTGRES_DB: noskytech_spike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seeds/001_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noskytech_spike"]
      interval: 3s
      timeout: 3s
      retries: 5
